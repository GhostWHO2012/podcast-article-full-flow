    <text x="21" y="24" fill="#ffffff" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">正文稿</text>
    <rect x="26" y="48" width="130" height="36" rx="18" fill="#2f7d55"/>
    <text x="47" y="72" fill="#ffffff" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">长图</text>
  </g>
