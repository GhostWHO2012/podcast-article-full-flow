<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">youtube-to-weixin-article</title>
  <desc id="desc">展示从 YouTube 字幕和截图到公众号文章与长图的项目首页图。</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef7f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#162018" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="#111814"/>
  <rect x="28" y="28" width="1224" height="364" rx="28" fill="url(#paper)"/>
  <g transform="translate(78 76)">
    <text x="0" y="38" fill="#17231c" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">youtube-to-weixin-article</text>
    <text x="0" y="98" fill="#17231c" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800">把视频资料变成</text>
    <text x="0" y="162" fill="#17231c" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800">公众号图文和长图</text>
    <text x="0" y="218" fill="#516057" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24">字幕 · 截图 · 来源链接 · 公众号长图</text>
    <g transform="translate(0 256)">
      <rect x="0" y="0" width="210" height="44" rx="22" fill="#17231c"/>
      <text x="24" y="29" fill="#ffffff" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">智能体技能</text>
      <rect x="226" y="0" width="242" height="44" rx="22" fill="#dbe9dd"/>
      <text x="250" y="29" fill="#17231c" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">实验沉淀</text>
    </g>
  </g>
  <g transform="translate(710 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="272" rx="22" fill="#ffffff"/>
    <rect x="28" y="30" width="148" height="84" rx="14" fill="#ea4335"/>
    <polygon points="86,50 86,94 124,72" fill="#ffffff"/>
    <rect x="198" y="38" width="160" height="14" rx="7" fill="#17231c"/>
    <rect x="198" y="68" width="120" height="12" rx="6" fill="#8b9790"/>
    <rect x="28" y="142" width="154" height="94" rx="12" fill="#dfe8e2"/>
    <rect x="206" y="142" width="154" height="94" rx="12" fill="#f2efe8"/>
    <path d="M188 187h28" stroke="#17231c" stroke-width="4" stroke-linecap="round"/>
    <path d="M210 177l12 10-12 10" fill="none" stroke="#17231c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1020 228)">
